spring:
  main:
    allow-circular-references: true

  batch:
    job:
      enabled: false

  shell:
    interactive:
      enabled: false
    command:
      version:
        enabled: false

  datasource:
    url: jdbc:h2:mem:test_db
    driverClassName: org.h2.Driver
    username: sa
    password:


  data:
    mongodb:
      uri: mongodb://localhost:27017/test_db
      host: localhost
      port: 27017
      database: test_db
      authentication-database: admin
      auto-index-creation: true

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.5

mongock:
  runner-type: "InitializingBean"
  change-logs-scan-package:
    - ru.otus.springbatch.testchangelogs
  mongo-db:
    write-concern:
      journal: false
    read-concern: local